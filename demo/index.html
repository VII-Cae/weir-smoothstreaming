<!doctype html>
<meta charset="utf-8">
<title>weir — streaming A/B</title>
<!--
  All three panes are fed the same text and the same delta sequence
  (token-sized slices, arriving in bursts with realistic jitter).

    1. naive    — el.textContent = fullTextSoFar, on every delta
    2. lite     — src/weir-lite.js: rAF-paced, only touches the growing paragraph
    3. full     — src/weir.js with fade: true, same plus per-character fade-in

  They run one at a time, never together — concurrent runs would fight over the
  main thread and the numbers would mean nothing.

  NOTE: run this in a VISIBLE tab. In a background tab browsers stop running
  requestAnimationFrame entirely, and weir deliberately switches to writing
  straight through (land on arrival, no fade), so all three panes finish instantly.
-->
<style>
  :root {
    --bg: #0e1113; --panel: #14181a; --line: rgba(168,218,220,.16);
    --ink: rgba(226,232,230,.9); --dim: rgba(226,232,230,.42); --accent: #7FCDCD;
  }
  * { box-sizing: border-box; }
  /* The three panes divide whatever height is left, so all of them stay on
     screen together — including on a 9:16 phone. The notes below them are
     deliberately pushed past the fold; you scroll for those, not for the panes. */
  body {
    margin: 0; padding: 24px 26px 32px; background: var(--bg); color: var(--ink);
    font: 14px/1.7 ui-serif, Georgia, "Times New Roman", serif;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  h1 { font-size: 15px; font-weight: 400; letter-spacing: .22em; color: var(--accent); margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 12.5px; margin-bottom: 20px; max-width: 78ch; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  button {
    background: none; border: 1px solid var(--line); color: var(--ink);
    padding: 7px 15px; border-radius: 3px; font: inherit; font-size: 13px; cursor: pointer;
    letter-spacing: .04em;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; }
  label { color: var(--dim); font-size: 12.5px; }
  select { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
           padding: 5px 8px; border-radius: 3px; font: inherit; font-size: 12.5px; }

  /* Stacked, not side by side: equal width means the same sentence wraps at the
     same place in every pane, which is the only way the pacing is comparable. */
  .panes { display: flex; flex-direction: column; gap: 12px; max-width: 900px; width: 100%; }
  .pane { border: 1px solid var(--line); border-radius: 4px; background: var(--panel);
          overflow: hidden; display: flex; flex-direction: column; }
  .cap { flex: 0 0 auto; padding: 8px 16px; border-bottom: 1px solid var(--line);
         font-size: 12px; letter-spacing: .1em; color: var(--dim);
         display: flex; justify-content: space-between; gap: 12px; }
  .cap b { color: var(--ink); font-weight: 400; letter-spacing: .04em; white-space: nowrap; }
  .cap code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Height scales with the viewport so all three panes share one screen — on a
     9:16 phone as well as on a laptop. Tied to the viewport rather than to a
     flex share, because the notes underneath must not be able to squeeze the
     panes: they sit below the fold and you scroll for them. */
  .out { height: clamp(110px, 20vh, 320px); height: clamp(110px, 20dvh, 320px);
         overflow-y: auto; padding: 13px 16px; }
  .out p { margin: 0 0 .8em; }
  .out p:last-child { margin-bottom: 0; }
  .naive { white-space: pre-wrap; }
  .stats { flex: 0 0 auto; display: flex; gap: 16px; padding: 7px 16px;
           border-top: 1px solid var(--line);
           font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim);
           flex-wrap: wrap; }
  .stats i { font-style: normal; color: var(--accent); }
  .stats i.warn { color: #e8a598; }

  /* The fade-in. Only opacity — translating the span makes the whole line
     jitter as it reflows. `both` pins the start value so there is no flash
     on the frame before the animation begins. */
  @keyframes weir-wet { from { opacity: 0; } to { opacity: 1; } }
  .weir-wet { animation: weir-wet 300ms ease-out both; }
  @media (prefers-reduced-motion: reduce) { .weir-wet { animation: none; } }

  /* Phone: trim every fixed band so the three panes still share one screen.
     At 390x844 that leaves each pane roughly 100px of text — five or six
     lines, which is plenty to watch a rhythm. */
  @media (max-width: 620px) {
    body { padding: 14px 14px 22px; font-size: 13px; }
    h1 { font-size: 13px; letter-spacing: .18em; }
    .sub { font-size: 11.5px; line-height: 1.55; margin-bottom: 12px; }
    .bar { gap: 6px; margin-bottom: 12px; }
    button { padding: 5px 11px; font-size: 12px; }
    select { padding: 4px 6px; font-size: 11.5px; max-width: 44vw; }
    .lw { display: none; }                 /* the selects say what they are */
    .panes { gap: 8px; }
    /* the toolbar wraps to two rows here, so give the panes a little less.
       At 390x844 this is ~127px each, and the three panes plus the toolbar
       still land around 750px — inside the fold on a 9:16 phone. */
    .out { height: clamp(88px, 15vh, 190px); height: clamp(88px, 15dvh, 190px); }
    .cap { padding: 6px 11px; font-size: 10.5px; letter-spacing: .06em; }
    .cap code { font-size: 10px; }
    .out { padding: 10px 12px; }
    .out p { margin-bottom: .6em; }
    .stats { padding: 6px 11px; gap: 10px; font-size: 10.5px; }
  }
  @media (max-width: 420px) {
    .cap code { display: none; }           /* keep the pane label, drop the filename */
  }
</style>

<h1>weir — streaming A/B</h1>
<div class="sub">
  Same text, same delta sequence, one pane at a time. Watch the rhythm rather than the clock:
  the first pane moves at the network's pace, the other two at the screen's.
</div>

<div class="bar">
  <button id="runAll">Run all</button>
  <button id="run0">naive</button>
  <button id="run1">lite</button>
  <button id="run2">full</button>
  <label><span class="lw">Length</span>
    <select id="len">
      <option value="1">short reply (~1.4k)</option>
      <option value="3" selected>long reply (~4.2k)</option>
      <option value="7">stress (~9.8k)</option>
    </select>
  </label>
  <label><span class="lw">Background load</span>
    <select id="load">
      <option value="0">no load</option>
      <option value="1" selected>light load</option>
      <option value="3">heavy load</option>
    </select>
  </label>
</div>

<div class="panes">
  <div class="pane">
    <div class="cap"><b>1 · naive</b> <code>el.textContent = fullTextSoFar</code></div>
    <div class="out" id="out0"></div>
    <div class="stats" id="st0">—</div>
  </div>
  <div class="pane">
    <div class="cap"><b>2 · lite</b> <code>weir-lite.js</code></div>
    <div class="out" id="out1"></div>
    <div class="stats" id="st1">—</div>
  </div>
  <div class="pane">
    <div class="cap"><b>3 · full</b> <code>weir.js — fade: true</code></div>
    <div class="out" id="out2"></div>
    <div class="stats" id="st2">—</div>
  </div>
</div>

<script src="../src/weir-lite.js"></script>
<script>window.WeirLite = window.Weir;</script>
<script src="../src/weir.js"></script>
<script>window.WeirFull = window.Weir;</script>
<script>
"use strict";

/* ---- corpus: paragraphs of varied sentence length, repeated to size ---- */
const PARA = [
  "Smoothness is not speed. It is predictability. A steady forty characters a second reads as far calmer than two hundred at once followed by a pause, even though the second one finishes sooner.",
  "The naive version has two problems stacked on top of each other: the write rhythm is the network's rhythm, and every write re-lays-out text that is already final. The first makes it look unsteady. The second makes it genuinely slow.",
  "Once those are separated, all that remains is choosing a water level — how far the display is allowed to lag behind the network. Too little and the jitter comes through; too much and the text feels a beat late. Three hundred milliseconds sits in the gap: short enough to go unnoticed, long enough to absorb a whole frame of jitter.",
  "There is a quieter point underneath. Once a paragraph is sealed by a blank line, it should never be touched again. The browser has already computed its line breaks, its glyph positions, its line boxes; as long as that paragraph does not change, all of it can be reused. Reassigning textContent throws every bit of it away and starts over.",
  "The fade is a smaller idea than it looks. Each frame's new characters go into their own span, the span fades in once, and when the stream ends they are all flattened back into plain text. One span per frame, not per character — at high refresh rates that is two or three characters at a time, which the eye reads as continuous.",
];
function corpus(mult) {
  const out = [];
  for (let i = 0; i < mult * 2; i++) out.push(PARA[i % PARA.length]);
  return out.join("\n\n");
}

/* ---- simulated arrival: token-sized slices, in bursts, with jitter ---- */
function deltas(text) {
  const parts = [];
  let i = 0, seed = 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  while (i < text.length) {
    const n = 3 + Math.floor(rnd() * 8);        // ~3-10 chars, roughly one token
    parts.push(text.slice(i, i + n));
    i += n;
  }
  return { parts, rnd };
}

/* ---- frame meter: only running during a run ---- */
function meter() {
  let frames = 0, worst = 0, jank = 0, last = 0, on = true;
  const t0 = performance.now();
  // A hidden tab gets no frames at all, and weir switches to writing straight
  // through — so a run that happened off-screen has nothing to show. Flag it
  // where it happens rather than warning about it up front.
  let wentHidden = document.hidden;
  const onVis = () => { if (document.hidden) wentHidden = true; };
  document.addEventListener("visibilitychange", onVis);
  const tick = (ts) => {
    if (!on) return;
    if (last) {
      const dt = ts - last;
      frames++;
      if (dt > worst) worst = dt;
      if (dt > 32) jank++;
    }
    last = ts;
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  return {
    stop() {
      on = false;
      document.removeEventListener("visibilitychange", onVis);
      const secs = (performance.now() - t0) / 1000;
      return { fps: frames / secs, worst, jank: frames ? (jank / frames) * 100 : 0,
               secs, hidden: wentHidden };
    },
  };
}

function show(el, m) {
  el.innerHTML = m.hidden
    ? '<i class="warn">tab was hidden — nothing to see, run it up front</i>'
    : 'fps <i>' + m.fps.toFixed(0) + '</i>' +
      '　worst <i class="' + (m.worst > 32 ? 'warn' : '') + '">' + m.worst.toFixed(0) + 'ms</i>' +
      '　jank <i>' + m.jank.toFixed(1) + '%</i>' +
      '　took <i>' + m.secs.toFixed(1) + 's</i>';
}

/* ---- a little main-thread work, so the comparison isn't run in a vacuum ---- */
function noise(level) {
  if (!level) return () => {};
  let on = true;
  const spin = () => {
    if (!on) return;
    const end = performance.now() + level * 1.2;
    let x = 0;
    while (performance.now() < end) x += Math.sqrt(x + 1);
    setTimeout(spin, 12);
  };
  spin();
  return () => { on = false; };
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function follower(host) {
  let stick = true;
  const onScroll = () => { stick = host.scrollHeight - host.scrollTop - host.clientHeight < 48; };
  host.addEventListener("scroll", onScroll, { passive: true });
  return {
    grow: () => { if (stick) host.scrollTop = host.scrollHeight; },
    off: () => host.removeEventListener("scroll", onScroll),
  };
}

/* ---- 1. naive: reassign the whole message on every delta ---- */
async function runNaive(host, text) {
  host.innerHTML = "";
  const span = document.createElement("span");
  span.className = "naive";
  host.appendChild(span);
  const { parts, rnd } = deltas(text);
  let raw = "";
  const m = meter();
  for (let i = 0; i < parts.length; i++) {
    raw += parts[i];
    span.textContent = raw;                       // <- whole message, every time
    host.scrollTop = host.scrollHeight;           // <- forced synchronous layout, every time
    if (i % (1 + Math.floor(rnd() * 4)) === 0) await sleep(14 + rnd() * 42);
  }
  return m.stop();
}

/* ---- 2 & 3. weir: deltas buffer, frames emit ---- */
async function runFlow(host, text, Weir, opts) {
  host.innerHTML = "";
  const f = follower(host);
  const flow = Weir.open(host, Object.assign({ block: "p", onGrow: f.grow }, opts));
  const { parts, rnd } = deltas(text);
  const m = meter();
  for (let i = 0; i < parts.length; i++) {
    flow.push(parts[i]);
    if (i % (1 + Math.floor(rnd() * 4)) === 0) await sleep(14 + rnd() * 42);
  }
  await flow.end();
  f.off();
  return m.stop();
}

const $ = (id) => document.getElementById(id);
const RUNS = [
  (text) => runNaive($("out0"), text),
  (text) => runFlow($("out1"), text, window.WeirLite, {}),
  (text) => runFlow($("out2"), text, window.WeirFull, { fade: true }),
];
const buttons = ["runAll", "run0", "run1", "run2"].map($);
const lock = (on) => buttons.forEach((b) => (b.disabled = on));

async function go(which) {
  lock(true);
  const text = corpus(Number($("len").value));
  const stopNoise = noise(Number($("load").value));
  try {
    const list = which === "all" ? [0, 1, 2] : [which];
    for (const i of list) {
      $("st" + i).textContent = "running…";
      show($("st" + i), await RUNS[i](text));
      if (list.length > 1) await sleep(400);
    }
  } finally {
    stopNoise();
    lock(false);
  }
}

$("runAll").onclick = () => go("all");
$("run0").onclick = () => go(0);
$("run1").onclick = () => go(1);
$("run2").onclick = () => go(2);
</script>
